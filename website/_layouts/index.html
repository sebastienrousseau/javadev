{{#extends "base"}}
{{#block "main"}}
<section id="hero" class="hero-section">
  <div class="container hero-container text-center">
    <div class="pill-badge">
      <span class="pill-tag">NEW</span>
      <span class="pill-text">v0.0.4 Unified Release · TMUX IDE · MCP Agent · Worktrees</span>
    </div>
    <h1 class="hero-title">{{headline}}</h1>
    <p class="hero-lead">{{lead}}</p>
    <div class="hero-cta-group">
      <a class="btn btn-primary btn-lg" href="#quickstart">Quick Start</a>
      <a class="btn btn-secondary btn-lg" href="https://github.com/sebastienrousseau/{{name}}" target="_blank" rel="noopener">Star on GitHub</a>
    </div>

    <!-- Authentic 4-Pane TMUX IDE Terminal Grid -->
    <figure class="terminal-preview-card" aria-label="4-Pane TMUX IDE Grid Preview">
      <figcaption class="terminal-header">
        <div class="window-dots">
          <span class="dot dot-red" aria-hidden="true"></span>
          <span class="dot dot-yellow" aria-hidden="true"></span>
          <span class="dot dot-green" aria-hidden="true"></span>
        </div>
        <div class="terminal-tab-bar font-mono">
          <span class="tmux-win-badge">[javadev]</span>
          <span class="tab-item active-tab">0:ide* (4 panes)</span>
          <span class="tab-item">1:bash</span>
          <span class="tab-item">2:mcp</span>
        </div>
        <div class="terminal-actions">
          <span class="badge-status font-mono">● Java 21 LTS Pattern Matching (Prefix + i)</span>
        </div>
      </figcaption>

      <div class="tmux-grid">
        <!-- Pane 1: Project Explorer (Left 20%) -->
        <div class="tmux-pane pane-explorer font-mono">
          <div class="pane-header">
            <span class="pane-title">1: Explorer</span>
            <span class="pane-badge">/work</span>
          </div>
          <div class="pane-content explorer-content">
<div class="tree-node dir">▼ src/</div>
<div class="tree-node dir">  ▼ main/java/dev/</div>
<div class="tree-node file active">    ▶ App.java</div>
<div class="tree-node file">      Task.java</div>
<div class="tree-node dir">  ▼ test/java/dev/</div>
<div class="tree-node file">    AppTest.java</div>
<div class="tree-node file">pom.xml</div>
          </div>
        </div>

        <!-- Center Column: Pane 2 (Editor Top) + Pane 3 (Terminal Bottom) -->
        <div class="tmux-center-col">
          <!-- Pane 2: Editor (Neovim LSP) -->
          <div class="tmux-pane pane-editor font-mono">
            <div class="pane-header">
              <span class="pane-title">2: Neovim (LSP)</span>
              <span class="pane-file">src/main/java/dev/App.java</span>
            </div>
            <div class="pane-content editor-content" tabindex="0" role="region" aria-label="Neovim Code Editor">
              <pre class="editor-code font-mono"><code><span class="code-comment">// src/main/java/dev/App.java · Java 21 LTS Pattern Matching</span>
<span class="code-kw">public sealed interface</span> <span class="code-type">Task</span> <span class="code-kw">permits</span> <span class="code-type">Query</span>, <span class="code-type">Mutation</span> {
    <span class="code-kw">record</span> <span class="code-type">Query</span>(<span class="code-type">String</span> id, <span class="code-type">Instant</span> timestamp) <span class="code-kw">implements</span> <span class="code-type">Task</span> {}
    <span class="code-kw">record</span> <span class="code-type">Mutation</span>(<span class="code-type">String</span> id, <span class="code-type">byte</span>[] payload) <span class="code-kw">implements</span> <span class="code-type">Task</span> {}

    <span class="code-kw">static</span> <span class="code-type">String</span> <span class="code-fn">describe</span>(<span class="code-type">Task</span> t) {
        <span class="code-kw">return switch</span> (t) {
            <span class="code-kw">case</span> <span class="code-type">Query</span>(<span class="code-kw">var</span> id, <span class="code-kw">var</span> ts) -&gt; <span class="code-str">"Query "</span> + id;
            <span class="code-kw">case</span> <span class="code-type">Mutation</span>(<span class="code-kw">var</span> id, _)   -&gt; <span class="code-str">"Mutation "</span> + id;
        };
    }
}</code></pre>
            </div>
          </div>

          <!-- Pane 3: Integrated Shell / Test Runner -->
          <div class="tmux-pane pane-terminal font-mono">
            <div class="pane-header">
              <span class="pane-title">3: Shell / Tests</span>
              <span class="pane-badge">idle</span>
            </div>
            <div class="pane-content terminal-content font-mono" tabindex="0" role="region" aria-label="Integrated Terminal">
<div class="cli-line"><span class="mcp-tl-ps">$ </span>mvn clean test &amp;&amp; mvn spotbugs:check</div>
<div class="cli-out">[INFO] Tests run: 24, Failures: 0, Errors: 0, Time: 0.31s</div>
<div class="cli-out cli-ok">✓ BUILD SUCCESS · OpenJDK 21 LTS</div>
            </div>
          </div>
        </div>

        <!-- Pane 4: AI Agent / MCP Server (Right 24%) -->
        <div class="tmux-pane pane-ai font-mono">
          <div class="pane-header">
            <span class="pane-title">4: Claude Code</span>
            <span class="pane-badge ai-badge">MCP Agent</span>
          </div>
          <div class="pane-content ai-content font-mono" tabindex="0" role="region" aria-label="AI Agent Panel">
<div class="ai-prompt"><span class="ai-sym">&gt;</span> Claude Code (MCP)</div>
<div class="ai-tool">⏺ Tool: jdtls.check()</div>
<div class="ai-res">✓ Exhaustive record switch pattern validated</div>
<div class="ai-tool">⏺ Tool: archunit.verify()</div>
<div class="ai-res">✓ Clean hexagonal architecture verified</div>
          </div>
        </div>
      </div>

      <!-- TMUX Status Bar -->
      <div class="tmux-status-bar font-mono">
        <span class="status-left">[javadev:ide*] 0:nvim* 1:mvn 2:claude "javadev-ide" 23:55</span>
        <span class="status-center">muxtree: main (clean) · mcp: stdio (JSON-RPC)</span>
        <span class="status-right">23:55 29-Aug-26</span>
      </div>
    </figure>
  </div>
</section>

<!-- Content sections rendered from Markdown -->
<div class="content-sections">
  {{!content}}
</div>

{{/block}}
